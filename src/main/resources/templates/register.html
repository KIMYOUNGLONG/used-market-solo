<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
<header class="top-nav">
    <div class="logo">
        <img src="/img/Daangn_Signature_RGB.png" alt="당근로고" />
    </div>
    <div class="nav-items">
        <a href="/">중고거래</a>
        <input type="text" placeholder="동네 이름을 검색해보세요" />
        <button>채팅하기</button>
        <button>로그인</button>
    </div>
</header>

<main>
    <div class="register-container">
        <form action="/register" method="post">
            <input type="text" name="username" placeholder="아이디 입력" required />
            <input type="password" name="password" placeholder="비밀번호 입력" required />
            <input type="text" name="nickname" placeholder="닉네임 입력" required />
            <button type="submit" class="register-btn">회원가입</button>
        </form>
    </div>
</main>
</body>
</html>
